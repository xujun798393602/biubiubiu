# CentOS 10 compatible docker-compose
# Prerequisites: Docker CE + docker-compose-plugin installed
#   sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
#   sudo dnf install docker-ce docker-ce-cli containerd.io docker-compose-plugin
#   sudo systemctl start docker && sudo systemctl enable docker

services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_test_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - /opt/auto-test/data/postgres:/var/lib/postgresql/data:z
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auto-test-net

  redis:
    image: redis:7-alpine
    container_name: auto-test-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /opt/auto-test/data/redis:/data:z
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auto-test-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auto-test-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auto_test_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      DEBUG: ${DEBUG:-false}
      LOG_FILE: /var/log/backend/app.log
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/uploads:z
      - /opt/auto-test/logs/backend:/var/log/backend:z
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - auto-test-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auto-test-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/auto-test/logs/nginx:/var/log/nginx:z
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      - backend
    networks:
      - auto-test-net

  runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.runner
    container_name: auto-test-runner
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auto_test_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
    volumes:
      - /opt/auto-test/logs:/logs:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auto-test-net
    profiles:
      - tools

networks:
  auto-test-net:
    driver: bridge
