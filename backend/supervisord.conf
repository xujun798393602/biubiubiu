[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -rfbport 5900
autorestart=true
priority=25

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
priority=50
